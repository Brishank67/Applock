name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The corrected Android project is uploaded to the repository as a ZIP.
      # GitHub does not extract ZIP uploads automatically, so extract it here
      # before running Gradle. This keeps the existing mobile upload workflow simple.
      - name: Extract corrected project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="app.zip"
          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found in the repository root."
            echo "Upload the corrected ZIP to the repository root and push/commit it."
            exit 1
          fi

          rm -rf /tmp/arushield-project
          mkdir -p /tmp/arushield-project
          unzip -q "$ZIP" -d /tmp/arushield-project

          # Handle both a flat ZIP and a ZIP containing one top-level folder.
          if [ -f /tmp/arushield-project/settings.gradle.kts ]; then
            SRC=/tmp/arushield-project
          else
            SRC=$(find /tmp/arushield-project -mindepth 1 -maxdepth 1 -type d | head -n 1)
            if [ -z "$SRC" ] || [ ! -f "$SRC/settings.gradle.kts" ]; then
              echo "ERROR: Could not find settings.gradle.kts inside $ZIP"
              exit 1
            fi
          fi

          # Replace the checked-out project files with the ZIP contents.
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name "$ZIP" -exec rm -rf {} +
          cp -a "$SRC"/. .

          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          echo "Corrected project extracted successfully."
          echo "Project files:"
          find app/src/main -type f | sort

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD" || { echo "ERROR: KEYSTORE_PASSWORD secret is not set"; exit 1; }
          gradle --no-daemon --stacktrace assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: AruShield-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
